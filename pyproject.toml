[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "tableau-spec"
version = "0.1.0"
description = "Tableau の .twb / .twbx ファイルを解析して HTML 仕様書を生成する CLI ツール"
requires-python = ">=3.9"

[project.optional-dependencies]
web = ["streamlit>=1.28"]

[project.scripts]
tableau-spec = "tableau_spec.cli:main"
tableau-spec-web = "tableau_spec.webapp:run_web"

[tool.setuptools.packages.find]
include = ["tableau_spec*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
